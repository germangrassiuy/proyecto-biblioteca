; PHP PORTATIL DE LA LIBRERIA
; Es el PHP 8.2 oficial para Windows con lo minimo que usa el sistema.
; No hace falta instalarlo: INICIAR.bat lo usa desde esta carpeta.
; (extension_dir se lo pasa INICIAR.bat, con la ruta completa: una ruta
;  relativa aca se mediria desde donde se abrio la consola, no desde aca.)

; La unica extension que hace falta: la que habla con la base SQLite.
extension = pdo_sqlite

; Mostrar los errores en pantalla. En un sistema publicado en internet
; esto va apagado; aca es un proyecto para aprender y conviene verlos.
display_errors  = On
error_reporting = E_ALL

; La zona horaria de Uruguay. El sistema no usa la hora de PHP (las
; fechas las pone la base), pero sin esto PHP avisa con un warning.
date.timezone = America/Montevideo
